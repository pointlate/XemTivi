# 1. Cấu hình bộ nhớ cho Gradle (Rất quan trọng để tránh lỗi tràn RAM trên GitHub)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 2. BẮT BUỘC: Bật AndroidX để sử dụng các thư viện hiện đại (AppCompat, Media3, Leanback...)
android.useAndroidX=true
android.enableJetifier=true

# 3. Tối ưu hóa tốc độ build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 4. Cấu hình chuẩn cho Kotlin
kotlin.code.style=official
kotlin.incremental=true

# 5. Tối ưu hóa tài nguyên (Giảm dung lượng file APK đầu ra)
android.nonTransitiveRClass=true